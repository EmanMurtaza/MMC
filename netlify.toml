[build]
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Never serve backend sources / project files as static assets
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/dev-server.mjs"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
